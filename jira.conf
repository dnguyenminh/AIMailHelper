# ============================================================
# Jira connection config — AIMailHelper (ticket AIMH-LOCAL)
# ============================================================
# Hiện trạng: pipeline chạy OFFLINE với placeholder AIMH-LOCAL.
# Đã verify (2026-10-14): không có Jira MCP child server trong
# orchestrator @48721 (find_tools ×4 variations + orchestration_status).
#
# KHI USER CẤP CREDENTIALS — điền 4 dòng dưới đây, sau đó:
#   Cách A (khuyên dùng): đăng ký Jira MCP child server vào orchestrator,
#     ví dụ Atlassian Remote MCP: https://mcp.atlassian.com/v1/sse
#     (OAuth qua browser lần đầu) hoặc 1 server jira local (npx
#     mcp-server-jira / image container tự host) trỏ tới site bên dưới.
#   Cách B: dùng REST API trực tiếp từ script PowerShell/curl:
#     POST {SITE}/rest/api/3/issue với Basic auth email:token.
#
# Sau khi kết nối được, sync từ placeholder sang ticket thật:
#   1. Tạo Epic: "AIMailHelper — Browser Extension AI cho Outlook 365"
#      (mô tả = PLAN.md mục 1-6, link source PLAN.md)
#   2. Tạo 6 sub-tasks từ STATUS.json → jira.subtasks (GĐ 1→6)
#   3. Attach documents: BRD-v1-*.docx, FSD-v1-*.docx, diagrams PNG
#      (naming: {DOC}-v{MAJOR}-{TICKET}.docx)
#   4. Transition Epic theo workflow mapping trong AGENTS.md, comment
#      mỗi lần chuyển, link related tickets.
#   5. Update STATUS.json: jira.connected=true, epicKey=<real key>,
#      giữ AIMH-LOCAL làm internal trace key trong RUN-LOG.
# ============================================================

JIRA_CONNECTED=false
JIRA_PLACEHOLDER_TICKET=AIMH-LOCAL
JIRA_PROJECT_PREFIX=AIMH

# --- ĐIỀN KHI CÓ (bắt buộc để sync) ---
JIRA_SITE=              # ví dụ: https://yourcompany.atlassian.net
JIRA_EMAIL=             # email tài khoản Atlassian
JIRA_API_TOKEN=         # tạo tại id.atlassian.com/manage-profile/security/api-tokens
JIRA_PROJECT_KEY=       # project đích, ví dụ AIMH (phải tồn tại trên site)

# --- Tùy chọn (override nếu project dùng scheme khác) ---
JIRA_ISSUE_TYPE_EPIC=Epic
JIRA_ISSUE_TYPE_SUBTASK=Sub-task
# Remote MCP (cách A): để trống nếu dùng REST (cách B)
JIRA_MCP_URL=https://mcp.atlassian.com/v1/sse
