# CI — chạy trên mọi push + pull request: typecheck → lint → test → build → artifact dist.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (Vitest)
        run: npm test

      - name: Build (Vite + CRXJS)
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: aimailhelper-dist
          path: dist/
          retention-days: 14
