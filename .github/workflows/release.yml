# Release — push tag v* (vd v1.1.10) → CI gates → build → zip dist → GitHub Release kèm zip.
# Tạo tag:  git tag v1.1.10 && git push origin v1.1.10
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + Lint + Test (gates trước khi phát hành)
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build (Vite + CRXJS)
        run: npm run build

      - name: Verify manifest version khớp tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(node -p "require('./dist/manifest.json').version")
          echo "tag=$VERSION manifest=$MANIFEST_VERSION"
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag $VERSION ≠ manifest version $MANIFEST_VERSION — bump version trước khi tag."
            exit 1
          fi

      - name: Package dist → zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          zip -r "../AIMailHelper-v${VERSION}.zip" .
          cd ..
          ls -la AIMailHelper-v*.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "AIMailHelper v$VERSION" \
            --generate-notes \
            "AIMailHelper-v${VERSION}.zip"
